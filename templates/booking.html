<section><div class="w narrow">
  <h1>{{booking.title}}</h1>
  <form id="f">
    <label>{{booking.name}}<input name="name" required></label>
    <label>{{booking.phone}}<input name="phone" type="tel" required></label>
    <label>{{booking.date}}<input name="date" type="date" required></label>
    <label>{{booking.time}}<input name="time" type="time" required></label>
    <label>{{booking.guests}}<input name="guests" type="number" min="1" max="100" required></label>
    <label>{{booking.notes}}<textarea name="notes" rows="3"></textarea></label>
    <button class="btn" type="submit">{{booking.submit}}</button>
  </form>
</div></section>
<script>
// Pas de serveur : la demande s'ouvre dans WhatsApp, prête à envoyer.
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var d=new FormData(e.target),t=[{{booking.whatsapp_msg|js}}];
  ['name','phone','date','time','guests','notes'].forEach(function(k){if(d.get(k))t.push(k+': '+d.get(k))});
  location.href='https://wa.me/{{wa}}?text='+encodeURIComponent(t.join('\n'));
});
</script>
