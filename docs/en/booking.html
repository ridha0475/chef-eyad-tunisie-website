<body>
<header class="nav"><div class="w">
  <a class="brand" href="index.html"><img src="../logo.jpeg" alt="Chef Eyad Tunisia"><span>Chef Eyad Tunisia</span></a>
  <nav><a href="about.html">About</a><span class="dd"><a href="menu.html">Menu</a><div><a href="menu.html#smoked">Smoked meats</a><a href="menu.html#sides">Sides</a><a href="menu.html#sauces">Sauces</a><a href="menu.html#drinks">Drinks and desserts</a></div></span><a href="events.html">Events</a><a href="contact.html">Contact</a></nav>

  <a class="btn" href="booking.html">Book now</a>
</div></header>
<main>
<section><div class="w narrow">
  <h1>Book a table</h1>
  <form id="f">
    <label>Name<input name="name" required></label>
    <label>Phone<input name="phone" type="tel" required></label>
    <label>Date<input name="date" type="date" required></label>
    <label>Time<input name="time" type="time" required></label>
    <label>Number of guests<input name="guests" type="number" min="1" max="100" required></label>
    <label>Notes (optional)<textarea name="notes" rows="3"></textarea></label>
    <button class="btn" type="submit">Send request</button>
  </form>
</div></section>
<script>
// Pas de serveur : la demande s'ouvre dans WhatsApp, prête à envoyer.
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var d=new FormData(e.target),t=["Hello, I would like to book a table at Chef Eyad."];
  ['name','phone','date','time','guests','notes'].forEach(function(k){if(d.get(k))t.push(k+': '+d.get(k))});
  location.href='https://wa.me/21629909375?text='+encodeURIComponent(t.join('\n'));
});
</script>

</main>
