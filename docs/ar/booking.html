<main>
<section><div class="w narrow">
  <h1>احجز طاولة</h1>
  <form id="f">
    <label>الاسم<input name="name" required></label>
    <label>الهاتف<input name="phone" type="tel" required></label>
    <label>التاريخ<input name="date" type="date" required></label>
    <label>الوقت<input name="time" type="time" required></label>
    <label>عدد الأشخاص<input name="guests" type="number" min="1" max="100" required></label>
    <label>ملاحظات (اختياري)<textarea name="notes" rows="3"></textarea></label>
    <button class="btn" type="submit">إرسال الطلب</button>
  </form>
</div></section>
<script>
// Pas de serveur : la demande s'ouvre dans WhatsApp, prête à envoyer.
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var d=new FormData(e.target),t=["مرحبًا، أودّ الحجز عند الشيف إياد."];
  ['name','phone','date','time','guests','notes'].forEach(function(k){if(d.get(k))t.push(k+': '+d.get(k))});
  location.href='https://wa.me/21629909375?text='+encodeURIComponent(t.join('\n'));
});
</script>

</main>
