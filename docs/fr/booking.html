</div></header>
<main>
<section><div class="w narrow">
  <h1>Réserver une table</h1>
  <form id="f">
    <label>Nom<input name="name" required></label>
    <label>Téléphone<input name="phone" type="tel" required></label>
    <label>Date<input name="date" type="date" required></label>
    <label>Heure<input name="time" type="time" required></label>
    <label>Nombre de convives<input name="guests" type="number" min="1" max="100" required></label>
    <label>Précisions (facultatif)<textarea name="notes" rows="3"></textarea></label>
    <button class="btn" type="submit">Envoyer la demande</button>
  </form>
</div></section>
<script>
// Pas de serveur : la demande s'ouvre dans WhatsApp, prête à envoyer.
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var d=new FormData(e.target),t=["Bonjour, je souhaite réserver chez Chef Eyad."];
  ['name','phone','date','time','guests','notes'].forEach(function(k){if(d.get(k))t.push(k+': '+d.get(k))});
  location.href='https://wa.me/21629909375?text='+encodeURIComponent(t.join('\n'));
});
</script>

</main>
